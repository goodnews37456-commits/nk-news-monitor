<!doctype html>

<html lang="ko">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#082451"
  >

  <meta
    name="description"
    content="북한 관련 최신 뉴스를 한눈에 확인하는 북한 NEWS Monitor"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="북한 NEWS"
  >


  <!-- PWA Manifest -->

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >


  <!-- Android / Chrome icon -->

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
  >


  <!-- iPhone / iPad -->

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >


  <title>
    북한 NEWS Monitor
  </title>


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="./styles.css"
  >

</head>


<body>

  <div class="app">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header>

      <div class="brand">

        <b>🇰🇵</b>

        <div>

          <h1>
            북한 NEWS
          </h1>

          <small>
            Monitor
          </small>

        </div>

      </div>


      <div class="actions">

        <button
          id="search"
          type="button"
          aria-label="검색"
        >
          ⌕
        </button>

        <button
          id="refresh"
          type="button"
          aria-label="새로고침"
        >
          ↻
        </button>

      </div>


      <div class="status">

        <i></i>

        <span id="status">
          최신 뉴스 확인 중...
        </span>

        <button
          id="quick"
          type="button"
        >
          지금 새로고침
        </button>

      </div>

    </header>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main id="main"></main>


    <!-- =================================================
         BOTTOM NAV
         ================================================= -->

    <nav>

      <button
        type="button"
        data-p="home"
      >
        ⌂
        <small>홈</small>
      </button>


      <button
        type="button"
        data-p="news"
      >
        ☷
        <small>뉴스</small>
      </button>


      <button
        type="button"
        data-p="saved"
      >
        ♡
        <small>저장됨</small>
      </button>


      <button
        type="button"
        data-p="alerts"
      >
        ♧
        <small>알림</small>
      </button>


      <button
        type="button"
        data-p="settings"
      >
        ⚙
        <small>설정</small>
      </button>

    </nav>

  </div>


  <!-- =================================================
       APP JS
       ================================================= -->

  <script src="./app.js"></script>


  <!-- =================================================
       SERVICE WORKER
       ================================================= -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker
            .register("./sw.js")
            .then(function (registration) {

              console.log(
                "Service Worker 등록 완료:",
                registration.scope
              );

            })
            .catch(function (error) {

              console.error(
                "Service Worker 등록 실패:",
                error
              );

            });

        }
      );

    }

  </script>

</body>

</html>
